# sonarjenkins/sonar-project.properties

# Project identification
sonar.projectKey=todo-app
sonar.projectName=To-Do List App
sonar.projectVersion=1.0

# Source code location
sonar.sources=.
sonar.exclusions=node_modules/**,public/**,Demo/**

# Language settings
sonar.language=js

# Encoding
sonar.sourceEncoding=UTF-8

# Test coverage (if you add tests later)
# sonar.tests=tests
# sonar.test.inclusions=tests/**/*.js

# Server connection (replace with your SonarQube server details)
sonar.host.url=http://your-sonarqube-server:9000
sonar.login=your-sonarqube-token
